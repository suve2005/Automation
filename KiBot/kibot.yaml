kibot:
  version: 1

preflight:
  erc: false
  drc: false
  check_zone_fills: true

outputs:
  - name: 'Factory_Gerbers'
    comment: 'Gerber files for PCB fabrication (e.g., JLCPCB)'
    type: gerber
    dir: 'Outputs/Gerbers'

  - name: 'Factory_Drill'
    comment: 'Excellon drill files for hole drilling'
    type: excellon
    dir: 'Outputs/Drill'

  - name: 'Interactive_BOM'
    comment: 'A visual HTML page to help humans solder the board'
    type: ibom
    dir: 'Outputs/BOM'
